<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campeonato Petz 2026</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e2a5a 0%, #2b4f95 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            margin-bottom: 14px;
        }

        .logo img {
            height: 108px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(30, 42, 90, 0.18));
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1e2a5a;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dce6;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2b5aa8;
            box-shadow: 0 0 0 3px rgba(43, 90, 168, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2b5aa8 0%, #1e4483 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 6px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(43, 90, 168, 0.32);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            padding: 10px 12px;
            background: #fdeaea;
            border-radius: 6px;
            border-left: 3px solid #dc2626;
        }

        .error-message.show {
            display: block;
        }

        .info-box {
            background: #eaf1fa;
            border-left: 3px solid #2b5aa8;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: #475569;
            margin-top: 22px;
        }

        .info-box code {
            background: #dbe6f7;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e6e8ef;
            border-top: 3px solid #2b5aa8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
            .logo img {
                height: 92px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo"><img src="logo.png" alt="Campeonato Petz 2026"></div>
            <h1>Campeonato Petz</h1>
            <p>2026</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu usuário"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="error-message" id="errorMessage"></div>

            <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Preencha todos os campos');
                return;
            }

            submitBtn.disabled = true;
            loading.classList.add('show');
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Erro ao fazer login');
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro de conexão. Tente novamente.');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        usernameInput.focus();
    </script>
</body>
</html>
